<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Bug Lab</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px 0;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <h1>Telegram Bug Lab</h1>

    <p id="status">Проверяем Telegram...</p>

    <button id="verify">
        Verify initData
    </button>

    <button id="copy">
        Copy initData
    </button>

    <pre id="result"></pre>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;

        document.getElementById("status").textContent =
            user
                ? "✅ Telegram Mini App обнаружена"
                : "❌ Telegram user не получен";


        // Проверка initData через наш backend
        document.getElementById("verify").onclick = async () => {

            const result = document.getElementById("result");

            result.textContent = "Отправляем запрос...";

            try {

                const response = await fetch(
                    "https://telegram-bug-lab.onrender.com/verify",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            initData: tg.initData
                        })
                    }
                );

                const data = await response.json();

                result.textContent =
                    JSON.stringify(data, null, 2);

            } catch (error) {

                result.textContent =
                    "❌ Ошибка: " + error.message;
            }
        };


        // Копирование initData
        document.getElementById("copy").onclick = async () => {

            const result = document.getElementById("result");

            if (!tg.initData) {

                result.textContent =
                    "❌ initData отсутствует";

                return;
            }

            try {

                await navigator.clipboard.writeText(
                    tg.initData
                );

                result.textContent =
                    "✅ initData скопирована в буфер обмена";

            } catch (error) {

                result.textContent =
                    "❌ Не удалось скопировать initData";
            }
        };

    </script>

</body>
</html>
