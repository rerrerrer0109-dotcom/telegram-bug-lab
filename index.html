<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bug Lab</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

<h1>Telegram Bug Lab</h1>

<p id="status">Проверяем...</p>

<button id="verify">Verify initData</button>

<pre id="result"></pre>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

document.getElementById("status").textContent =
    user ? "✅ Telegram Mini App обнаружена" : "❌ Telegram user не получен";

document.getElementById("verify").onclick = async () => {

    document.getElementById("result").textContent =
        "Отправляем запрос...";

    try {

        const response = await fetch(
            "https://telegram-bug-lab.onrender.com/verify",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    initData: tg.initData
                })
            }
        );

        const data = await response.json();

        document.getElementById("result").textContent =
            JSON.stringify(data, null, 2);

    } catch (e) {

        document.getElementById("result").textContent =
            "Ошибка: " + e.message;
    }
};
</script>

</body>
</html>
