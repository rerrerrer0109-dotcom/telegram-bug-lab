<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Account Isolation Lab</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px 0;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #eee;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Telegram Account Isolation Lab</h1>

<p id="status">Проверяем Telegram...</p>

<button id="write">
    Write marker for current account
</button>

<button id="read">
    Read stored markers
</button>

<button id="clear">
    Clear browser storage
</button>

<pre id="result">
Сначала нажми Write marker for current account
</pre>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const result =
    document.getElementById("result");

const user =
    tg.initDataUnsafe?.user;

document.getElementById("status").textContent =
    user
        ? "✅ Telegram Mini App обнаружена"
        : "❌ Telegram user отсутствует";


function accountFingerprint() {
    if (!user?.id) {
        return "UNKNOWN";
    }

    const text =
        String(user.id);

    return "ACC-" +
        text.slice(-4);
}


function createMarker() {
    return (
        accountFingerprint() +
        "-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2, 10)
    );
}


function getCookie(name) {
    const cookies =
        document.cookie.split(";");

    for (const cookie of cookies) {
        const [key, ...rest] =
            cookie.trim().split("=");

        if (key === name) {
            return decodeURIComponent(
                rest.join("=")
            );
        }
    }

    return null;
}


document.getElementById("write").onclick = () => {

    const marker =
        createMarker();

    localStorage.setItem(
        "tg_lab_marker",
        marker
    );

    sessionStorage.setItem(
        "tg_lab_marker",
        marker
    );

    document.cookie =
        "tg_lab_marker=" +
        encodeURIComponent(marker) +
        "; path=/; SameSite=Lax";

    result.textContent =
`
✅ Marker written

Current account fingerprint:
${accountFingerprint()}

Marker:
${marker}

Теперь:
1. Закрой Mini App
2. Переключись на другой Telegram-аккаунт
3. Открой этот же Mini App
4. НЕ нажимай Write
5. Нажми Read stored markers
`;
};


document.getElementById("read").onclick = () => {

    const local =
        localStorage.getItem(
            "tg_lab_marker"
        );

    const session =
        sessionStorage.getItem(
            "tg_lab_marker"
        );

    const cookie =
        getCookie(
            "tg_lab_marker"
        );

    result.textContent =
`
Current account fingerprint:
${accountFingerprint()}

localStorage:
${local ?? "NONE"}

sessionStorage:
${session ?? "NONE"}

cookie:
${cookie ?? "NONE"}
`;
};


document.getElementById("clear").onclick = () => {

    localStorage.removeItem(
        "tg_lab_marker"
    );

    sessionStorage.removeItem(
        "tg_lab_marker"
    );

    document.cookie =
        "tg_lab_marker=; Max-Age=0; path=/";

    result.textContent =
        "✅ Storage cleared";
};

</script>

</body>
</html>
