<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Telegram InitData Lab</title>

    <script
        src="https://telegram.org/js/telegram-web-app.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px 0;
            padding: 12px 18px;
            font-size: 16px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #eee;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>Telegram initData Lab</h1>

<p id="status">
    Проверяем Telegram...
</p>

<button id="inspect">
    Inspect current initData
</button>

<pre id="result">
Нажми Inspect current initData
</pre>

<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

document.getElementById(
    "status"
).textContent =
    tg.initData
        ? "✅ Telegram Mini App обнаружена"
        : "❌ initData отсутствует";

document.getElementById(
    "inspect"
).onclick =
    async () => {

    const result =
        document.getElementById(
            "result"
        );

    result.textContent =
        "Проверяем...";

    try {

        const response =
            await fetch(
                "https://telegram-bug-lab.onrender.com/inspect",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                tg.initData
                        })
                }
            );

        const data =
            await response.json();

        result.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    } catch (error) {

        result.textContent =
            "❌ Ошибка: " +
            error.message;
    }
};

</script>

</body>
</html>
