<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telegram Account Isolation Lab
    </title>

    <script
        src="https://telegram.org/js/telegram-web-app.js">
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px 0;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
            background: #eee;
            padding: 15px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<h1>
    Telegram Account Isolation Lab
</h1>

<p id="status">
    Проверяем Telegram...
</p>

<button id="login">
    Create session for THIS account
</button>

<button id="check">
    Check stored session
</button>

<button id="clear">
    Delete stored session
</button>

<pre id="result">
Сначала работаем с аккаунтом №1
</pre>

<script>

const tg =
    window.Telegram.WebApp;

tg.ready();
tg.expand();

const result =
    document.getElementById(
        "result"
    );

document.getElementById(
    "status"
).textContent =
    tg.initData
        ? "✅ Telegram Mini App обнаружена"
        : "❌ initData отсутствует";


/*
  ACCOUNT №1:

  сервер создаёт token,
  браузер сохраняет его
  в localStorage.
*/
document.getElementById(
    "login"
).onclick =
    async () => {

    result.textContent =
        "Создаём лабораторную сессию...";

    try {

        const response =
            await fetch(
                "https://telegram-bug-lab.onrender.com/lab-login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                tg.initData
                        })
                }
            );

        const data =
            await response.json();

        if (!data.ok) {
            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            return;
        }

        localStorage.setItem(
            "tg_lab_session",
            data.sessionToken
        );

        /*
          Не показываем raw token.
        */

        result.textContent =
`
✅ SESSION CREATED

Telegram account:
${data.telegram_account}

Session fingerprint:
${data.session_fingerprint}

Token сохранён в localStorage.

Теперь:

1. Закрой Mini App
2. Переключись на аккаунт №2
3. Открой этот же Mini App
4. НЕ нажимай Create session
5. Нажми Check stored session
`;

    } catch (error) {

        result.textContent =
            "❌ " + error.message;
    }
};


/*
  Отправляем одновременно:

  - новую initData текущего аккаунта
  - старый token из localStorage
*/
document.getElementById(
    "check"
).onclick =
    async () => {

    const sessionToken =
        localStorage.getItem(
            "tg_lab_session"
        );

    result.textContent =
        "Проверяем...";

    try {

        const response =
            await fetch(
                "https://telegram-bug-lab.onrender.com/lab-check",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                tg.initData,

                            sessionToken:
                                sessionToken
                        })
                }
            );

        const data =
            await response.json();

        result.textContent =
            JSON.stringify(
                data,
                null,
                2
            );

    } catch (error) {

        result.textContent =
            "❌ " + error.message;
    }
};


document.getElementById(
    "clear"
).onclick =
    () => {

    localStorage.removeItem(
        "tg_lab_session"
    );

    result.textContent =
        "✅ Local session deleted";
};

</script>

</body>

</html>
