<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telegram Start Param Lab</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 18px;
        }

        .box {
            border: 1px solid #aaa;
            padding: 12px;
            margin: 10px 0;
            word-break: break-all;
        }

        button {
            padding: 12px 18px;
            font-size: 16px;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>

<h2>Telegram Start Param Lab v2</h2>

<div class="box">
    <b>Platform:</b>
    <span id="platform"></span>
</div>

<div class="box">
    <b>Telegram version:</b>
    <span id="version"></span>
</div>

<div class="box">
    <b>Signed start_param:</b>
    <div id="signed"></div>

    <b>Length:</b>
    <span id="signedLength"></span>
</div>

<div class="box">
    <b>tgWebAppStartParam from query:</b>
    <div id="queryParam"></div>

    <b>Length:</b>
    <span id="queryLength"></span>
</div>

<div class="box">
    <b>tgWebAppStartParam from hash:</b>
    <div id="hashParam"></div>

    <b>Length:</b>
    <span id="hashLength"></span>
</div>

<div class="box">
    <b>Detected URL param:</b>
    <div id="detected"></div>

    <b>Length:</b>
    <span id="detectedLength"></span>
</div>

<div class="box">
    <b>Comparison:</b>
    <div id="comparison"></div>
</div>

<button id="copy">
    Copy safe report
</button>

<pre id="result"></pre>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const data = tg.initDataUnsafe || {};

const signedParam =
    data.start_param ?? null;


// ===================================
// QUERY STRING
// ===================================

const queryParams =
    new URLSearchParams(
        window.location.search
    );

const queryStartParam =
    queryParams.get(
        "tgWebAppStartParam"
    );


// ===================================
// HASH
// ===================================

let hashText =
    window.location.hash || "";

if (hashText.startsWith("#")) {
    hashText =
        hashText.substring(1);
}

const hashParams =
    new URLSearchParams(
        hashText
    );

const hashStartParam =
    hashParams.get(
        "tgWebAppStartParam"
    );


// ===================================
// DETECTED
// ===================================

const detectedParam =
    queryStartParam ??
    hashStartParam ??
    null;


// ===================================
// OUTPUT
// ===================================

document.getElementById(
    "platform"
).textContent =
    tg.platform || "NONE";


document.getElementById(
    "version"
).textContent =
    tg.version || "NONE";


document.getElementById(
    "signed"
).textContent =
    signedParam ?? "NONE";

document.getElementById(
    "signedLength"
).textContent =
    signedParam !== null
        ? signedParam.length
        : 0;


document.getElementById(
    "queryParam"
).textContent =
    queryStartParam ?? "NONE";

document.getElementById(
    "queryLength"
).textContent =
    queryStartParam !== null
        ? queryStartParam.length
        : 0;


document.getElementById(
    "hashParam"
).textContent =
    hashStartParam ?? "NONE";

document.getElementById(
    "hashLength"
).textContent =
    hashStartParam !== null
        ? hashStartParam.length
        : 0;


document.getElementById(
    "detected"
).textContent =
    detectedParam ?? "NONE";

document.getElementById(
    "detectedLength"
).textContent =
    detectedParam !== null
        ? detectedParam.length
        : 0;


// ===================================
// COMPARISON
// ===================================

let comparison = "";

if (
    signedParam === detectedParam
) {

    comparison =
        "✅ MATCH";

} else {

    comparison =
        "⚠️ MISMATCH";

}

document.getElementById(
    "comparison"
).textContent =
    comparison;


// ===================================
// SAFE REPORT
// ===================================

document.getElementById(
    "copy"
).onclick =
async () => {

    const report = {

        platform:
            tg.platform || null,

        version:
            tg.version || null,

        signed_length:
            signedParam?.length || 0,

        query_length:
            queryStartParam?.length || 0,

        hash_length:
            hashStartParam?.length || 0,

        detected_length:
            detectedParam?.length || 0,

        signed_equals_detected:
            signedParam === detectedParam

    };

    try {

        await navigator.clipboard.writeText(
            JSON.stringify(
                report,
                null,
                2
            )
        );

        document.getElementById(
            "result"
        ).textContent =
            "✅ Safe report copied";

    } catch {

        document.getElementById(
            "result"
        ).textContent =
            "❌ Copy failed";

    }

};
</script>

</body>
</html>
