<<!DOCTYPE html>

<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Telegram Bug Lab
    </title>


    <script
        src="https://telegram.org/js/telegram-web-app.js">
    </script>


    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        button {
            display: block;
            margin: 10px 0;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }

        pre {
            white-space: pre-wrap;
            word-break: break-word;

            background: #eeeeee;

            padding: 15px;

            border-radius: 8px;
        }

    </style>

</head>


<body>


<h1>
    Telegram start_param Lab
</h1>


<p id="status">
    Проверяем Telegram...
</p>


<button id="check">
    Check start_param
</button>


<button id="tamper">
    Simulate URL tamper
</button>


<pre id="result">
Нажми Check start_param
</pre>



<script>

const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();



const status =
    document.getElementById("status");


if (tg.initData) {

    status.textContent =
        "✅ Telegram Mini App обнаружена";

} else {

    status.textContent =
        "❌ initData отсутствует";

}



function getQueryStartParam() {

    const query =
        new URLSearchParams(
            window.location.search
        );

    return query.get(
        "tgWebAppStartParam"
    );

}



function getHashStartParam() {

    const hash =
        window.location.hash
            .replace(/^#/, "");

    const params =
        new URLSearchParams(hash);

    return params.get(
        "tgWebAppStartParam"
    );

}



function detectURLStartParam() {

    return (
        getQueryStartParam() ||
        getHashStartParam() ||
        null
    );

}



async function checkStartParam() {

    const result =
        document.getElementById(
            "result"
        );


    result.textContent =
        "Проверяем...";


    try {

        const response =
            await fetch(
                "https://telegram-bug-lab.onrender.com/verify",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            initData:
                                tg.initData
                        })

                }
            );


        const data =
            await response.json();


        if (!data.ok) {

            result.textContent =
                JSON.stringify(
                    data,
                    null,
                    2
                );

            return;
        }


        const signed =
            data.signedStartParam;


        const queryValue =
            getQueryStartParam();


        const hashValue =
            getHashStartParam();


        const detected =
            detectURLStartParam();


        const match =
            signed === detected;


        result.textContent =
`
Signed start_param:
${signed ?? "NONE"}

Length:
${signed?.length ?? 0}


tgWebAppStartParam from query:
${queryValue ?? "NONE"}

Length:
${queryValue?.length ?? 0}


tgWebAppStartParam from hash:
${hashValue ?? "NONE"}

Length:
${hashValue?.length ?? 0}


Detected URL param:
${detected ?? "NONE"}

Length:
${detected?.length ?? 0}


Comparison:

${match
    ? "✅ MATCH"
    : "⚠️ MISMATCH"}
`;

    }

    catch (error) {

        result.textContent =
            "❌ Ошибка: " +
            error.message;

    }

}



document
    .getElementById("check")
    .onclick =
        checkStartParam;



document
    .getElementById("tamper")
    .onclick =
        () => {

    const url =
        new URL(
            window.location.href
        );


    /*
      Мы специально меняем
      ТОЛЬКО значение URL.

      Подписанный initData
      не изменяется.
    */

    url.searchParams.set(
        "tgWebAppStartParam",
        "test999"
    );


    history.replaceState(
        {},
        "",
        url
    );


    document
        .getElementById("result")
        .textContent =
`
⚠️ URL локально изменён.

tgWebAppStartParam = test999

Подписанный Telegram initData
НЕ изменялся.

Теперь нажми:

Check start_param
`;

};


</script>


</body>

</html>
