<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Telegram Security Lab</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body {
    font-family: Arial, sans-serif;
    padding: 18px;
}
.box {
    border: 1px solid #aaa;
    padding: 12px;
    margin: 10px 0;
    word-break: break-all;
}
button {
    padding: 12px;
    margin: 5px;
}
</style>
</head>

<body>

<h2>Telegram Security Lab</h2>

<div class="box">
    <b>Platform:</b>
    <span id="platform"></span>
</div>

<div class="box">
    <b>Version:</b>
    <span id="version"></span>
</div>

<div class="box">
    <b>User ID:</b>
    <span id="userid"></span>
</div>

<div class="box">
    <b>query_id:</b>
    <span id="queryid"></span>
</div>

<div class="box">
    <b>auth_date:</b>
    <span id="authdate"></span>
</div>

<div class="box">
    <b>start_param:</b>
    <span id="startparam"></span>
</div>

<div class="box">
    <b>chat_type:</b>
    <span id="chattype"></span>
</div>

<div class="box">
    <b>chat_instance:</b>
    <span id="chatinstance"></span>
</div>

<button id="copy">
Copy report
</button>

<pre id="result"></pre>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const data = tg.initDataUnsafe || {};

document.getElementById("platform").textContent =
    tg.platform || "NONE";

document.getElementById("version").textContent =
    tg.version || "NONE";

document.getElementById("userid").textContent =
    data.user?.id || "NONE";

document.getElementById("queryid").textContent =
    data.query_id || "NONE";

document.getElementById("authdate").textContent =
    data.auth_date || "NONE";

document.getElementById("startparam").textContent =
    data.start_param || "NONE";

document.getElementById("chattype").textContent =
    data.chat_type || "NONE";

document.getElementById("chatinstance").textContent =
    data.chat_instance || "NONE";


document.getElementById("copy").onclick = async () => {

    const report = {
        platform: tg.platform,
        version: tg.version,

        user_id:
            data.user?.id || null,

        query_id:
            data.query_id || null,

        auth_date:
            data.auth_date || null,

        start_param:
            data.start_param || null,

        chat_type:
            data.chat_type || null,

        chat_instance:
            data.chat_instance || null
    };

    await navigator.clipboard.writeText(
        JSON.stringify(report, null, 2)
    );

    document.getElementById("result").textContent =
        "✅ Report copied";
};

</script>

</body>
</html>
